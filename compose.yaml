name: stellar-lodge
x-app: &app
  build: .
  image: stellar-lodge:local
  env_file: .env
  environment:
    DB_HOST: db
    DB_NAME: lodge
    DB_USER: lodge
  volumes:
    - uploads:/app/media
  init: true
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lodge
      POSTGRES_USER: lodge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodge -d lodge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "127.0.0.1:${WEB_PORT:-8092}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: python manage.py send_notifications
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  database:
  uploads:
