# Install as /etc/apache2/sites-available/ss-rooms.krzywonski.me.conf
<VirtualHost *:80>
    ServerName ss-rooms.krzywonski.me
    Redirect permanent / https://ss-rooms.krzywonski.me/
</VirtualHost>

<VirtualHost *:443>
    ServerName ss-rooms.krzywonski.me

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/krzywonski.me-0001/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/krzywonski.me-0001/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 57671680
    ProxyPass        / http://127.0.0.1:8092/
    ProxyPassReverse / http://127.0.0.1:8092/

    ErrorLog ${APACHE_LOG_DIR}/ss-rooms.krzywonski.me_error.log
    # Omit URL paths so verification and password-reset tokens stay out of access logs.
    CustomLog ${APACHE_LOG_DIR}/ss-rooms.krzywonski.me_access.log "%h %t %m %>s %D"
</VirtualHost>
